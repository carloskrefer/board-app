<div class="container" [class]="classes()">
    @if(snackbar().isCountingDown) {
    <app-progress-bar class="progress" [current]="currentProgress()" [maximum]="snackbar().duration"
        [transitionDuration]="service.INTERVAL" [color]="progressBarColor()" />
    }
    @switch (snackbar().type) {
    @case (snackbarTypeEnum.Info) {
    <span class="material-symbols-outlined">info</span>
    }
    @case (snackbarTypeEnum.Success) {
    <span class="material-symbols-outlined">check_circle</span>
    }
    @case (snackbarTypeEnum.Warning) {
    <span class="material-symbols-outlined">warning</span>
    }
    @case (snackbarTypeEnum.Error) {
    <span class="material-symbols-outlined">error</span>
    }
    @default {
    <span class="material-symbols-outlined">info</span>
    }
    }
    <div class="text-close-container">
        <p class="text">{{ snackbar().text }}</p>
        <app-close-button (click)="close.emit()" />
    </div>
</div>
