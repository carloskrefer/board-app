<app-label for="password" text="Password" />
<div class="input-container">
    <input [type]="type()" id="password" class="input g-form-input" autocomplete="password" [formField]="formField()"
        [class.input-error]="showError()" />
    <app-visibility-button class="visibility-button" [(isVisible)]="isVisible" [isInsideInput]="true" />
</div>
@if (showError())
{
<app-error-list [formField]="formField()" />
}
