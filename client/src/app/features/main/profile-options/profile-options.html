<app-button class="button" label="Profile" icon="attribution" mode="outline" [borderHidden]="true" alignment="start"
    mainColor="gray-medium" />
<app-button class="button" label="Logout" icon="logout" mode="outline" [borderHidden]="true" alignment="start"
    mainColor="error" />
<app-button class="button" label="Close" icon="close" mode="outline" [borderHidden]="true" alignment="start"
    mainColor="gray-light" (click)="close.emit()" />
