@for(error of loginForm().errors(); track error) {
@if (error.message) {
<app-banner [message]="error.message" type="error" />
}
}
<form class="form" [formRoot]="loginForm">
    <app-email-field [formField]="loginForm.email" />
    <app-password-field [formField]="loginForm.password" />
    <app-button label="Log in" type="submit" [isLoading]="loginForm().submitting()" />
</form>
<app-button label="Sign in" mode="outline" (click)="navigateToSignInPage()" />
